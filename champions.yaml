# Pool de campeões. Chave = id do Data Dragon (ex.: MissFortune).
# Build NÃO fica aqui: o módulo de build calculada vai decidir pelos atributos reais.
#
# niveis_fortes:   níveis em que o all-in/troca forte é bom (comparado ao oponente)
# itens_spike:     quantos itens completos marcam o power spike principal
# allin_nivel:     a partir de que nível o all-in passa a ser forte
# alvo:            foco principal (usado depois pelo módulo de build)
# dicas_vantagem / dicas_desvantagem: frases curtas (até ~8 palavras) faladas às vezes.
#   Dica que depende de feitiço: {texto: "...", requer_feitico: SummonerDot}
#   (SummonerDot = Incendiar, SummonerFlash, SummonerTeleport, SummonerExhaust, SummonerSmite...)
# peso_dano / peso_defesa: quanto vale +1% de dano no combo x +1% de vida efetiva no ranking de itens
# build_exige / build_proibe / build_vida_max: classe de item aceita pro campeão
#   atributos: ad, ap, hp, armor, mr, ah, lethality, armor_pen_pct, magic_pen, magic_pen_pct,
#              as_pct, crit, lifesteal, omnivamp, ms, ms_pct
#   exige = o item precisa dar pelo menos um (botas não precisam); proibe = não pode dar nenhum

Zed:
  rota: MIDDLE
  estilo: assassino
  alvo: carregadores_frageis
  niveis_fortes: [3, 6]
  allin_nivel: 6
  itens_spike: 1
  peso_dano: 1.0
  peso_defesa: 0.25
  build_exige: [ad, lethality]
  build_proibe: [ap, crit, as_pct, magic_pen, magic_pen_pct, lifesteal]
  build_vida_max: 300
  dicas_vantagem:
    - "Troque com W, E e Q juntos"
    - "All-in com a ult"
    - {texto: "All-in com ult e Incendiar", requer_feitico: SummonerDot}
    - "Use a sombra pra acertar Q duplo"
  dicas_desvantagem:
    - "Farme com Q de longe"
    - "Guarde a sombra pra fugir"
    - "Espere o nível 6 pra lutar"

Mel:
  rota: MIDDLE                 # primeiro plano B quando banem o Zed (15/4/10 contra Diana em 2026-11-06)
  estilo: mago_alcance
  alvo: carregadores_frageis
  niveis_fortes: [3, 6]
  allin_nivel: 6
  itens_spike: 1
  peso_dano: 0.9
  peso_defesa: 0.3
  build_exige: [ap]
  build_proibe: [ad, crit, as_pct, lethality, lifesteal]
  dicas_vantagem:
    - "Acerte seu E, a armadilha, e solte o Q"
    - "Use seu W, a refutação, contra o projétil dele"
    - "Com marcas no alvo, seu R finaliza de longe"
  dicas_desvantagem:
    - "Farme com seu Q, a rajada, de longe"
    - "Guarde seu W, a refutação, pra se defender"
    - "Fique atrás da wave e cutuque com o Q"

